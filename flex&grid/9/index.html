<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task 10 - Nested Grid Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="main-grid">

    <div class="cell">Item 1</div>

    <div class="cell">
      <div class="sub-grid two-cols two-rows">
        <div class="sub-item">Sub 1</div>
        <div class="sub-item">Sub 2</div>
        <div class="sub-item">Sub 3</div>
        <div class="sub-item">Sub 4</div>
      </div>
    </div>

    <div class="cell">
      <div class="sub-grid two-cols two-rows">
        <div class="sub-item">Sub 1</div>
        <div class="sub-item">Sub 2</div>
        <div class="sub-item">Sub 3</div>
        <div class="sub-item">Sub 4</div>
      </div>
    </div>

    <div class="cell">Item 4</div>

    <div class="cell">Item 5</div>

    <div class="cell">
      <div class="sub-grid two-rows">
        <div class="sub-item">Sub 1</div>
        <div class="sub-item">Sub 2</div>
      </div>
    </div>

    <div class="cell">
      <div class="sub-grid two-cols">
        <div class="sub-item">Sub 1</div>
        <div class="sub-item">Sub 2</div>
      </div>
    </div>

    <div class="cell">Item 8</div>

    <div class="cell">
      <div class="sub-grid two-cols two-rows">
        <div class="sub-item">Sub 1</div>
        <div class="sub-item">Sub 2</div>
        <div class="sub-item">Sub 3</div>
        <div class="sub-item">Sub 4</div>
      </div>
    </div>

    <div class="cell">Item 10</div>
    <div class="cell">Item 11</div>

    <div class="cell">
      <div class="sub-grid two-cols two-rows">
        <div class="sub-item">Sub 1</div>
        <div class="sub-item">Sub 2</div>
        <div class="sub-item">Sub 3</div>
        <div class="sub-item">Sub 4</div>
      </div>
    </div>

  </div>

</body>
</html>
